<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAIPrompts</title>
  <script>
    // Роутер для чистых URL
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;
    
    const routes = {
      '/': '/index.html',
      '/generator': '/generator.html',
      '/pricing': '/pricing.html',
      '/development': '/development.html',
      '/year': '/year.html',
      '/settings': '/settings.html',
      '/404': '/404.html'
    };
    
    // Проверяем, есть ли маршрут
    if (routes[path]) {
      // Перенаправляем на реальный файл с сохранением параметров
      const redirectUrl = routes[path] + search + hash;
      window.location.replace(redirectUrl);
    } else {
      // Показываем красивую страницу 404
      document.body.innerHTML = `
        <style>
          body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
          }
          .error-container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
          }
          h1 {
            font-size: 4rem;
            margin: 0;
            color: white;
          }
          p {
            font-size: 1.2rem;
            margin: 1rem 0 2rem;
            opacity: 0.9;
          }
          .home-btn {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
          }
          .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
          }
          .emoji {
            font-size: 5rem;
            margin-bottom: 1rem;
          }
          .suggestions {
            margin-top: 2rem;
            text-align: left;
            background: rgba(255,255,255,0.1);
            padding: 1.5rem;
            border-radius: 10px;
          }
        </style>
        <div class="error-container">
          <div class="emoji">🔍</div>
          <h1>404</h1>
          <p>Страница не найдена</p>
          <p>Возможно, вы ищете одну из этих страниц:</p>
          
          <div class="suggestions">
            <ul style="list-style: none; padding: 0; margin: 0;">
              <li style="margin-bottom: 10px;">👉 <a href="/" style="color: #ffd700; text-decoration: none;">Главная</a></li>
              <li style="margin-bottom: 10px;">👉 <a href="/generator" style="color: #ffd700; text-decoration: none;">Генератор</a></li>
            </ul>
          </div>
          
          <a href="/" class="home-btn">На главную</a>
        </div>
      `;
    }
  </script>
</head>
<body></body>
</html>
