<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нет соединения — TAIPrompts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: #121212;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .offline-loader {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            background: #121212;
            opacity: 1;
            visibility: visible;
            transition: opacity .3s ease, visibility .3s ease;
        }
        .offline-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .offline-loader-content { display: grid; justify-items: center; gap: 16px; color: #fff; font: 600 14px/1.4 Inter, system-ui, sans-serif; }
        .offline-loader-mark { display: grid; width: 52px; height: 52px; place-items: center; border: 1px solid rgba(94,114,228,.45); border-radius: 18px; color: #5e72e4; background: rgba(94,114,228,.1); box-shadow: 0 0 36px rgba(94,114,228,.18); }
        .offline-loader-mark svg { width: 25px; height: 25px; animation: offline-loader-spin 2.8s ease-in-out infinite; }
        .offline-loader-track { width: 100px; height: 3px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.1); }
        .offline-loader-track::before { display: block; width: 42%; height: 100%; border-radius: inherit; background: #5e72e4; content: ""; animation: offline-loader-progress 1.2s ease-in-out infinite; }
        @keyframes offline-loader-spin { 50% { transform: rotate(90deg) scale(.9); } }
        @keyframes offline-loader-progress { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
        @media (prefers-reduced-motion: reduce) { .offline-loader-mark svg, .offline-loader-track::before { animation-duration: 2.5s; } .offline-loader { transition-duration: .01ms; } }
        .offline-card {
            max-width: 420px;
            width: 100%;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 48px 32px 40px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }
        .offline-icon {
            font-size: 56px;
            margin-bottom: 20px;
            opacity: 0.6;
        }
        .offline-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .offline-subtitle {
            color: #adb5bd;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            color: #fff;
            background: #5e72e4;
            margin-bottom: 12px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(94, 114, 228, 0.25);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.12);
            box-shadow: none;
        }
        .btn-geo {
            background: rgba(94, 114, 228, 0.15);
            border: 1px solid rgba(94, 114, 228, 0.25);
        }
        .btn-geo:hover {
            background: rgba(94, 114, 228, 0.25);
            box-shadow: 0 10px 30px rgba(94, 114, 228, 0.15);
        }
        .btn-label {
            display: block;
            margin-top: 6px;
            color: #adb5bd;
            font-size: 13px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(30,30,40,0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px 24px;
            color: #fff;
            font-size: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast-success {
            border-color: rgba(94, 114, 228, 0.3);
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff6b6b;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .offline-status {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            font-size: 14px;
            color: #adb5bd;
        }
        @media (max-width: 480px) {
            .offline-card { padding: 32px 20px 28px; }
            .offline-title { font-size: 24px; }
            .btn { padding: 14px; font-size: 15px; }
        }
    </style>
  <meta name="theme-color" content="#121212">
</head>
<body>
    <div class="offline-loader" id="offlineLoader" role="status" aria-live="polite" aria-label="Загрузка страницы">
        <div class="offline-loader-content">
            <span class="offline-loader-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5 14.4 9.6 20.5 12l-6.1 2.4L12 20.5l-2.4-6.1L3.5 12l6.1-2.4L12 3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m18.5 3 .7 1.8L21 5.5l-1.8.7-.7 1.8L17.8 6.2 16 5.5l1.8-.7.7-1.8Z" fill="currentColor"/></svg></span>
            <span>TAIPrompts</span>
            <span class="offline-loader-track" aria-hidden="true"></span>
        </div>
    </div>
    <div class="offline-card">
        <div class="offline-icon">📡</div>
        <div class="offline-title">Вы оффлайн</div>
        <p class="offline-subtitle">Подключитесь к сети, чтобы создавать крутые промпты уже сегодня.</p>

        <div class="offline-status">
            <span class="status-dot"></span>
            Нет соединения с сервером
        </div>

        <button class="btn" id="retryBtn">🔄 Попробовать снова</button>

        <button class="btn btn-geo" id="geoBtn" type="button">
            📍 Проверить геолокацию
            <span class="btn-label">Нажмите, чтобы проверить доступ</span>
        </button>

    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            const loader = document.getElementById('offlineLoader');
            const finish = () => {
                loader.classList.add('is-hidden');
                setTimeout(() => loader.remove(), 350);
            };
            if (document.readyState === 'complete') finish();
            else window.addEventListener('load', finish, { once: true });
            setTimeout(finish, 2500);
        })();
    </script>
    <script>
        (function() {
            const retryBtn = document.getElementById('retryBtn');
            const geoBtn = document.getElementById('geoBtn');
            const toast = document.getElementById('toast');

            let toastTimeout = null;

            function showToast(message, isSuccess = true) {
                if (toastTimeout) {
                    clearTimeout(toastTimeout);
                    toast.classList.remove('show');
                }

                toast.textContent = message;
                toast.className = 'toast' + (isSuccess ? ' toast-success' : '');
                
                // Триггерим reflow
                void toast.offsetWidth;
                toast.classList.add('show');

                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                    toastTimeout = null;
                }, 3500);
            }

            retryBtn.addEventListener('click', function() {
                location.reload();
            });

            geoBtn.addEventListener('click', function() {
                if (!navigator.geolocation) {
                    showToast('Геолокация не поддерживается этим браузером.', false);
                    return;
                }

                showToast('📍 Проверяем доступ к геолокации…');
                navigator.geolocation.getCurrentPosition(
                    function() {
                        showToast('Доступ к геолокации разрешён.');
                    },
                    function(error) {
                        const message = error.code === error.PERMISSION_DENIED
                            ? 'Доступ не выдан — всё в порядке, геолокация для сайта не обязательна.'
                            : 'Не удалось получить доступ к геолокации. Попробуйте ещё раз.';
                        showToast(message, false);
                    },
                    { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 }
                );
            });

            window.addEventListener('online', function() {
                showToast('🔄 Соединение восстановлено. Нажмите «Попробовать снова».');
            });

        })();
    </script>
</body>
</html>
